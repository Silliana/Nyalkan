plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.earlywindow', 'false'
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.runtimeClasspath)
        }

        server {
            server()
            programArgument '--nolight'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'foundry.veil' }
    }
}

project.ext.lwjglVersion = "3.3.3"
project.ext.winNatives = "natives-windows"
project.ext.linuxNatives = "natives-linux"
project.ext.macosNatives = "natives-macos"
project.ext.macosArmNatives = "natives-macos-arm64"

configurations {
    shadedNatives
}

dependencies {
    jarJar("org.lwjgl:lwjgl-vulkan:[$lwjglVersion,)") { version { strictly lwjglVersion } }
    compileOnly("org.lwjgl:lwjgl-vulkan:$lwjglVersion")
    runtimeOnly("org.lwjgl:lwjgl-vulkan:$lwjglVersion")
    jarJar("org.lwjgl:lwjgl-vma:[$lwjglVersion,)") { version { strictly lwjglVersion } }
    jarJar("org.lwjgl:lwjgl-shaderc:[$lwjglVersion,)") { version { strictly lwjglVersion } }
    compileOnly("org.lwjgl:lwjgl-vma:$lwjglVersion")
    compileOnly("org.lwjgl:lwjgl-shaderc:$lwjglVersion")
    runtimeOnly("org.lwjgl:lwjgl-vma:$lwjglVersion")
    runtimeOnly("org.lwjgl:lwjgl-shaderc:$lwjglVersion")
    compileOnly('foundry.veil:veil-neoforge-1.21.1:4.3.2') { transitive = false }
    compileOnly('software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2') { transitive = false }
    shadedNatives("org.lwjgl:lwjgl-vma:$lwjglVersion:$winNatives")
    shadedNatives("org.lwjgl:lwjgl-vma:$lwjglVersion:$linuxNatives")
    shadedNatives("org.lwjgl:lwjgl-vma:$lwjglVersion:$macosNatives")
    shadedNatives("org.lwjgl:lwjgl-vma:$lwjglVersion:$macosArmNatives")
    shadedNatives("org.lwjgl:lwjgl-shaderc:$lwjglVersion:$winNatives")
    shadedNatives("org.lwjgl:lwjgl-shaderc:$lwjglVersion:$linuxNatives")
    shadedNatives("org.lwjgl:lwjgl-shaderc:$lwjglVersion:$macosNatives")
    shadedNatives("org.lwjgl:lwjgl-shaderc:$lwjglVersion:$macosArmNatives")
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Implementation-Version': project.version)
    }
    from {
        configurations.shadedNatives.collect { zipTree(it) }
    } {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', '**/*.class'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}
