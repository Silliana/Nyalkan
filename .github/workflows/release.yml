name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/checkout@v7
        with:
          repository: Silliana/maven
          ssh-key: ${{ secrets.MAVEN_DEPLOY_KEY }}
          path: maven
      - run: chmod +x ./gradlew
      - run: ./gradlew build publishMavenJavaPublicationToStagingRepository -PmavenRepo="$GITHUB_WORKSPACE/maven"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: build/libs/*.jar
      - id: publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*.jar
          name: Nyalkan ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: ${{ contains(github.ref_name, 'alpha') && 'alpha' || contains(github.ref_name, 'beta') && 'beta' || 'release' }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
      - name: Modrinth client only
        if: steps.publish.outputs.modrinth-version != ''
        run: |
          curl -sf -X PATCH "https://api.modrinth.com/v3/version/${{ steps.publish.outputs.modrinth-version }}" \
            -H "Authorization: ${{ secrets.MODRINTH_TOKEN }}" -H "User-Agent: Silliana/Nyalkan" \
            -H "Content-Type: application/json" -d '{"environment":"client_only"}'
      - name: Publish to maven
        run: |
          cd maven
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "(build) Nyalkan ${GITHUB_REF_NAME#v}"
          git push
