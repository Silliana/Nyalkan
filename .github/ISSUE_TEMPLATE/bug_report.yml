name: Bug Report
description: Report a crash, visual bug or broken mod
body:
  - type: markdown
    attributes:
      value: >-
        - Write the report in **English**.

        - Check the [issue list](https://github.com/Silliana/Nyalkan/issues) first, someone may have reported it already.

        - Please do not ask other mod developers to add Nyalkan support. Report it here instead.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened and what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: >-
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Nyalkan and NeoForge versions.
      placeholder: Nyalkan 0.1.0-alpha, NeoForge 21.1.x
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: GPU, driver version and OS.
      placeholder: RTX 3070 Ti, driver 591.74, Windows 11
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list or modpack
      description: The modpack name and version, or your list of mods.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: >-
        Your crash report (`crash-reports/`) and `logs/latest.log` from the instance folder.
      placeholder: Drag and drop the files in this box.
    validations:
      required: true
